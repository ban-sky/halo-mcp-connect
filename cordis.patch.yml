# halo-mcp-connect bundle patch
#
# Mounts this bundle's Host half (the settings route) and the MCP client row
# that connects to the Halo site. The Client half is discovered from the
# package's `dsh.client` manifest and rendered by the Web UI on this bundle's
# page, so the site address and MCP key are editable at runtime.
- insert:
    - id: halo-mcp-connect
      name: 'halo-mcp-connect'
    - id: mcp-halo
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: halo
        transport: streamable-http
        url: https://blog.lonelyx.cn/mcp
        headers: {}
        toolCallTimeoutMs: 60000
        # Never let a bad key or unreachable site kill the Loader entry: the
        # client stays active with zero tools, so the settings card can repair
        # the config without a restart.
        failOnStartupError: false
